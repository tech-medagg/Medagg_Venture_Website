<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EB246B" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Medagg Ventures" />
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />

    <!-- Default SEO (overridden per-page by react-helmet-async) -->
    <title>Medagg Ventures — Healthcare Strategy, Operations &amp; Advisory</title>
    <meta
      name="description"
      content="Medagg Ventures is India's leading healthcare consulting firm offering strategic consulting, hospital O&M contracts, transaction advisory, and channel partnerships for hospitals and healthcare investors."
    />
    <meta name="keywords" content="healthcare consulting India, hospital management consulting, healthcare advisory, hospital operations, healthcare mergers acquisitions, O&M contracts hospital, channel partnerships healthcare, Medagg Ventures" />

    <!-- Canonical fallback -->
    <link rel="canonical" href="https://www.medagg.com/" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="/assets/images/medagg_favicon_32px.png" type="image/png" />
    <link rel="icon" href="/assets/images/medagg_favicon_32px.png" type="image/png" />

    <!-- Open Graph fallback -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Medagg Ventures" />
    <meta property="og:title" content="Medagg Ventures — Healthcare Strategy, Operations &amp; Advisory" />
    <meta property="og:description" content="India's leading healthcare consulting firm — strategic consulting, hospital O&M contracts, transaction advisory, and channel partnerships." />
    <meta property="og:url" content="https://www.medagg.com/" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Medagg Ventures — Healthcare Strategy, Operations &amp; Advisory" />
    <meta name="twitter:description" content="India's leading healthcare consulting firm." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- WebSite Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Medagg Ventures",
      "url": "https://www.medagg.com",
      "description": "India's leading healthcare consulting and advisory firm",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.medagg.com/contact?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
